<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useId } = React;

/* ------------------------------------------------------------------ */
/* Navigation                                                          */
/* ------------------------------------------------------------------ */
const NAV = [
  ["Overview", [["Dashboard", "dashboard"]]],
  ["File Management", [["Customers", "fm-customer"], ["Products & Stock", "fm-product"], ["Price & Discounts", "fm-pricing"], ["Delivery Resources", "fm-delivery"]]],
  ["Transactions", [["Sales Order", "tr-so"], ["Pick & Pack", "tr-pick"], ["Shipping / Stock Out", "tr-ship"], ["Sales Invoice", "tr-inv"], ["Customer Payment", "tr-pay"], ["Returns & Adjustments", "tr-ret"]]],
  ["Reports", [["Sales Reports", "rp-sales"], ["Distribution & Stock", "rp-dist"], ["Billing & Collections", "rp-coll"]]]
];

/* ------------------------------------------------------------------ */
/* Small building blocks                                               */
/* ------------------------------------------------------------------ */
const TONES = {
  ok: "bg-[#DDEFE6] text-[#1D5E3C]",
  warn: "bg-[#FBEBD0] text-[#7A4B07]",
  bad: "bg-[#F8DCDC] text-[#8A1F1F]",
  info: "bg-[#DCE8F5] text-[#1F4B7A]",
  gray: "bg-line2 text-sub"
};
const Pill = ({ tone = "gray", children }) => (
  <span className={`inline-block px-2.5 py-0.5 rounded-full text-xs font-semibold whitespace-nowrap ${TONES[tone]}`}>{children}</span>
);

const Card = ({ className = "", children, as: Tag = "div" }) => (
  <Tag className={`bg-white border border-line rounded-[10px] ${className}`}>{children}</Tag>
);

const Sec = ({ children }) => (
  <p className="m-0 text-xs tracking-[.08em] uppercase text-brand font-bold">{children}</p>
);

const inputCls = "w-full box-border h-10 border border-[#C7CDD1] rounded-md px-3 text-sm bg-white text-ink focus:outline-none focus:ring-2 focus:ring-brand/30 focus:border-brand";

const Field = ({ label, value = "", ro, mono, type = "text", placeholder, span, bold }) => {
  const id = useId();
  return (
    <div className={span === "full" ? "col-span-full" : span === 2 ? "sm:col-span-2" : ""}>
      <label htmlFor={id} className="block text-xs font-semibold text-sub mb-1.5 tracking-wide">{label}</label>
      <input
        id={id}
        type={type}
        defaultValue={value}
        readOnly={ro}
        placeholder={placeholder}
        className={`${inputCls} ${ro ? "bg-paper text-sub" : ""} ${mono ? "font-mono text-[13px]" : ""} ${bold ? "font-semibold" : ""}`}
      />
    </div>
  );
};

const Sel = ({ label, options, span }) => {
  const id = useId();
  return (
    <div className={span === "full" ? "col-span-full" : span === 2 ? "sm:col-span-2" : ""}>
      <label htmlFor={id} className="block text-xs font-semibold text-sub mb-1.5 tracking-wide">{label}</label>
      <select id={id} className={inputCls}>{options.map((o) => <option key={o}>{o}</option>)}</select>
    </div>
  );
};

const Grid = ({ min = 210, children }) => (
  <div className="grid gap-4" style={{ gridTemplateColumns: `repeat(auto-fit, minmax(${min}px, 1fr))` }}>{children}</div>
);
const Grid2 = ({ children }) => <div className="grid gap-3.5 grid-cols-1 sm:grid-cols-2">{children}</div>;

const Btn = ({ kind = "primary", children, onClick, small }) => {
  const k = {
    primary: "bg-brand border-brand text-white hover:bg-brand-dark",
    secondary: "bg-white border-[#C7CDD1] text-ink hover:bg-paper",
    danger: "bg-white border-[#E7B8B8] text-[#8A1F1F] hover:bg-[#FDF3F3]"
  }[kind];
  return (
    <button type="button" onClick={onClick}
      className={`${small ? "h-9 px-3.5 text-[13px]" : "h-10 px-[18px] text-sm"} rounded-md font-semibold border cursor-pointer whitespace-nowrap ${k}`}>
      {children}
    </button>
  );
};

const Actions = ({ children, border = true }) => (
  <div className={`flex flex-wrap gap-2.5 justify-end ${border ? "border-t border-line2 pt-4" : ""}`}>{children}</div>
);

const KV = ({ k, v, strong, className = "" }) => (
  <div className={`flex justify-between gap-3 text-sm py-1.5 ${className}`}>
    <span>{strong ? <strong>{k}</strong> : k}</span>
    <span>{strong ? <strong>{v}</strong> : v}</span>
  </div>
);

const Totals = ({ children }) => (
  <div className="flex-[0_1_340px] bg-paper rounded-lg px-4 py-3.5">{children}</div>
);

/* cols: [header, key, {r: right-align, mono, bold, render}] */
const Table = ({ cols, rows, total }) => (
  <div className="overflow-x-auto">
    <table className="w-full border-collapse text-[13px]">
      <thead>
        <tr>
          {cols.map(([h, , o = {}]) => (
            <th key={h} className={`font-semibold text-sub bg-paper px-3 py-2.5 border-b border-line whitespace-nowrap ${o.r ? "text-right" : "text-left"}`}>{h}</th>
          ))}
        </tr>
      </thead>
      <tbody>
        {rows.map((row, i) => (
          <tr key={i}>
            {cols.map(([h, key, o = {}]) => (
              <td key={h} className={`px-3 py-2.5 border-b border-line2 whitespace-nowrap ${o.r ? "text-right" : ""} ${o.mono ? "font-mono text-[12.5px]" : ""} ${o.bold ? "font-semibold" : ""}`}>
                {o.render ? o.render(row) : row[key]}
              </td>
            ))}
          </tr>
        ))}
        {total && (
          <tr>
            {total.map((t, i) => (
              <td key={i} colSpan={t.span || 1} className={`px-3 py-2.5 font-bold border-t-2 border-ink ${t.r ? "text-right" : ""}`}>{t.v}</td>
            ))}
          </tr>
        )}
      </tbody>
    </table>
  </div>

/* ------------------------------------------------------------------ */
/* Router (hash-based, works on GitHub Pages and file://)              */
/* ------------------------------------------------------------------ */
const SCREENS = {
  "login": Login,
  "dashboard": Dashboard,
  "fm-customer": FmCustomer,
  "fm-product": FmProduct,
  "fm-pricing": FmPricing,
  "fm-delivery": FmDelivery,
  "tr-so": TrSalesOrder,
  "tr-pick": TrPickPack,
  "tr-ship": TrShipping,
  "tr-inv": TrInvoice,
  "tr-pay": TrPayment,
  "tr-ret": TrReturns,
  "rp-sales": RpSales,
  "rp-dist": RpDistribution,
  "rp-coll": RpCollections
};

const readHash = () => {
  const h = (window.location.hash || "").replace("#", "");
  return SCREENS[h] ? h : "login";
};

function App() {
  const [screen, setScreen] = useState(readHash);
  useEffect(() => {
    const onHash = () => setScreen(readHash());
    window.addEventListener("hashchange", onHash);
    return () => window.removeEventListener("hashchange", onHash);
  }, []);
  const go = (id) => {
    if (window.location.hash !== "#" + id) window.location.hash = id;
    else setScreen(id);
    window.scrollTo(0, 0);
  };
  const Screen = SCREENS[screen];
  return <Screen screen={screen} go={go} />;
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
